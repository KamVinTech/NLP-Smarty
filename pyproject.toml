[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-smarty"
version = "0.6.0"
description = "Deterministic, zero-LLM prompt optimizer and repo-intelligence layer (hooks + MCP) for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NLP-Smarty contributors" }]
keywords = ["prompt-optimization", "token-savings", "context-compression", "llm-gateway", "mcp", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/KamVinTech/NLP-Smarty"
Repository = "https://github.com/KamVinTech/NLP-Smarty"
Issues = "https://github.com/KamVinTech/NLP-Smarty/issues"

[project.optional-dependencies]
# Optional accelerators; every module has a zero-dependency fallback.
nlp = ["spacy", "flashtext", "rank-bm25"]
dev = ["pytest>=7"]

[project.scripts]
contextgate = "contextgate.cli:main"
smarty = "contextgate.cli:main"
smarty-mcp = "contextgate.mcp_server:main"
smarty-hook = "contextgate.hook:main"
smarty-gateway = "contextgate.gateway:main"

[tool.setuptools]
packages = ["contextgate"]
