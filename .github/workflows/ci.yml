name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest (26.04) has no Python 3.9 for setup-python
    strategy:
      fail-fast: false  # a failure on one Python version must not cancel the others
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30  # eval_retrieval.py walks git history
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python tools/check_release.py  # versions aligned, no junk tracked
      - run: echo '{"id":"1","command":"ping"}' | python bridge_server.py
      - name: The installed wheel works from an empty directory (one package, no flat modules)
        run: |
          pip install . -q
          cd "$RUNNER_TEMP" && python -I -c "from contextgate import gate_text; assert gate_text('Could you please fix this', 1)[1]" && contextgate --help > /dev/null
          git init -q "$RUNNER_TEMP/target" && echo 'def f(): return 1' > "$RUNNER_TEMP/target/a.py"
          contextgate init --root "$RUNNER_TEMP/target" && contextgate doctor --root "$RUNNER_TEMP/target" && contextgate uninstall --root "$RUNNER_TEMP/target" --purge
      - run: python eval_retrieval.py -n 10 --min-recall5 0.0
  extension:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest (26.04) has no Python 3.9 for setup-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run compile
